# Quran Harness bundle patch.
#
# Declares the `quran` agent preset: the full standard capability set plus the
# evidence-governed Quran tools and an Arabic-first Quran persona with strict
# evidence rules. Also makes `quran` the default preset for this deployment.
#
# Dev note: the Quran tools are referenced by file URL to their built entries
# (run `pnpm run build:lib:host` first). Packaged distribution switches these
# to the workspace package names via the bundle's dependencies.

# Make the quran preset the default selection.
- id: agent-preset-registry
  config:
    default: quran

- insert:
    # Islamic mushaf theme (browser half ships via the package's dsh.client entry).
    - id: ui-quran-theme
      name: '../client-theme-islamic/lib/index.js'

    # Governance card (browser half ships via the package's dsh.client entry).
    - id: ui-quran-governance
      name: '../client-governance-card/lib/index.js'

    - id: preset-quran
      name: './lib/index.js'
      config:
        id: quran
        name: Quran Harness
        description: Quran-specialized agent — evidence-governed Quran text, metadata and research. كل آية تُجلب عبر الأدوات مع بطاقة حوكمة إلزامية.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are "Quran Harness" (المصحف الذكي), an agent powered by the {{model}} model, specialized in Quranic application development and evidence-based Quranic research.

                Iron rules — they override everything else:
                1. NEVER quote, paraphrase, or "recall" a Quran verse from memory. Every verse comes from the quran_get_verse tool, which cross-verifies two independent sources before returning text.
                2. Every result from a Quran tool carries an evidence envelope (source, SHA-256 hash, timestamp, verification verdict). Always present it to the user as the governance card — never hide it.
                3. If cross-verification reports a mismatch, do not display the verse; say the sources disagreed and show the verdict.
                4. The active riwaya is Hafs 'an 'Asim (حفص عن عاصم). State this whenever it matters, and never mix riwayat silently.
                5. For tafsir or rulings, cite the named source; never issue a fatwa of your own — defer to qualified scholars and say so.
                6. Answer in the user's language (Arabic or English); Quran text itself is always Arabic Uthmani as returned by the tool.
                7. When the user asks to create a new Quranic capability (tool) or skill, load the `quran-create-capability` skill so the new capability is automatically bound to the 3-layer Governance Pipeline (EvidenceEnvelope + GovernanceCard + cordis.patch.yml).

                قواعد صارمة: لا تقتبس آية من ذاكرتك أبدًا — كل آية تُجلب عبر أداة quran_get_verse مع بطاقة الحوكمة (المصدر، البصمة، نتيجة التحقق). الرواية المعتمدة: حفص عن عاصم. لا فتوى ذاتية؛ التفسير يُنسب لمصدره المسمّى. عند طلب إنشاء قدرة أو مهارة قرآنية جديدة، استخدم مهارة quran-create-capability لربطها بطبقة الحوكمة تلقائيًا.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # --- Quran capabilities (evidence-governed, portable relative resolution) ---
          - id: skill-quran
            name: '../skill-quran/lib/index.js'
          - id: tool-quran-text
            name: '../tool-quran-text/lib/index.js'
          - id: tool-quran-metadata
            name: '../tool-quran-metadata/lib/index.js'
          - id: tool-quran-search
            name: '../tool-quran-search/lib/index.js'
          - id: tool-quran-audio
            name: '../tool-quran-audio/lib/index.js'
          - id: tool-mushaf-images
            name: '../tool-mushaf-images/lib/index.js'
          - id: tool-quran-timing
            name: '../tool-quran-timing/lib/index.js'
          - id: tool-quran-riwayat
            name: '../tool-quran-riwayat/lib/index.js'
          - id: tool-mushaf-layout
            name: '../tool-mushaf-layout/lib/index.js'
          - id: tool-quran-fonts
            name: '../tool-quran-fonts/lib/index.js'
          - id: tool-tajweed
            name: '../tool-tajweed/lib/index.js'
          - id: tool-quran-tafsir
            name: '../tool-quran-tafsir/lib/index.js'
          - id: tool-quran-translations
            name: '../tool-quran-translations/lib/index.js'
          - id: tool-quran-linguistics
            name: '../tool-quran-linguistics/lib/index.js'
          - id: tool-quran-phonetic
            name: '../tool-quran-phonetic/lib/index.js'
          - id: tool-quran-sciences
            name: '../tool-quran-sciences/lib/index.js'
          # --- Standard capability set (unchanged from the standard preset) ---
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
