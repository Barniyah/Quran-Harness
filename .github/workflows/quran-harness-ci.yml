name: Quran Harness CI

on:
  workflow_dispatch:
  push:
    branches: [main, quran-harness-agy]
  pull_request:
    branches: [main, quran-harness-agy]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quran-harness-tests:
    name: Quran Harness (95 Deterministic Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quran Harness test suite (21 suites / 95 tests)
        run: pnpm exec vitest run packages/quran
